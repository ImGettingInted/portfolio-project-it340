<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="reg-log-page">
    <form class="reg-log-card" id="register-form">
      <h1><b>Create Account</b></h1>

      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full_name" maxlength="100" autocomplete="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" maxlength="150" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" name="confirm" minlength="8" autocomplete="new-password" required />

      <button type="submit">Create Account</button>
      <p id="auth-message" role="status" aria-live="polite"></p>
      <p class="reg-log">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </form>
    <script src="js/auth.js"></script>
  </body>
</html>
